{% extends "base.html" %}
{% block title %}Đăng ký - LaptopS{% endblock %}
{% block content %}
<section class="auth">
  <h1>Tạo tài khoản</h1>
  <form method="post" novalidate>
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>Họ và tên<input name="name" value="{{ form.get('name', '') }}" autocomplete="name" maxlength="60" required autofocus></label>
    <label>Email<input type="email" name="email" value="{{ form.get('email', '') }}" autocomplete="email" maxlength="120" required></label>
    <label>Mật khẩu <small>(ít nhất 8 ký tự)</small><input type="password" name="password" autocomplete="new-password" minlength="8" required></label>
    <label>Nhập lại mật khẩu<input type="password" name="password2" autocomplete="new-password" required></label>
    <button class="cta wide">Đăng ký</button>
  </form>
  <p class="alt">Đã có tài khoản? <a href="{{ url_for('login') }}">Đăng nhập</a></p>
</section>
{% endblock %}
